name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run package

      - name: End-to-end check against the packaged arm64 binary
        run: |
          bunx playwright install chromium
          bin=$(mktemp -d)
          tar -xzf dist/headroom-*-darwin-arm64.tar.gz -C "$bin"
          HEADROOM_BIN="$bin/headroom" bun scripts/e2e.ts

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 headroom-*.tar.gz | tee SHA256SUMS

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/headroom-*.tar.gz

      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/headroom-*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Headroom $TAG" \
            --notes "Built by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from $GITHUB_SHA. Install and verify per packaging/README.md."
